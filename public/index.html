<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grass Stains | Best on Ground</title>
<meta name="theme-color" content="#04131F">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/logo.png" as="image">
<link rel="preload" href="/bg.jpg" as="image">
<link rel="preload" href="/fonts/graduate-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Graduate";src:url(/fonts/graduate-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  color-scheme: light;
  --navy:#04131F; --navy-2:#0B2233;
  --cream:#F8F1E3; --paper:#FFFDF8;
  --grass:#6CB52C; --grass-deep:#2F5A10; --grass-ink:#3D7A12;
  --bg:var(--cream); --surface:var(--paper); --ink:var(--navy); --muted:#55606A;
  --line:#E2D8C4; --accent:var(--grass-ink);
  --gold:#C9971F; --silver:#8E969F; --bronze:#A8652F; --danger:#B3261E;
  --panel:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#06172A; --surface:#0E2438; --ink:#F8F1E3; --muted:#9EAAB4;
    --line:#1E3A52; --accent:var(--grass);
    --gold:#E2B33C; --silver:#B8BEC6; --bronze:#D08C52; --danger:#F2B8B5;
    --panel:#0B1E30;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Barlow",system-ui,sans-serif;font-size:16px;line-height:1.45;
  background:var(--bg);color:var(--ink);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
/* Photo background, pinned to the viewport (a fixed layer, since iOS ignores background-attachment:fixed) */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:var(--bg) url(/bg.jpg) center bottom/cover no-repeat;
}
h1,h2,.tab,.pts,.rank{font-family:"Graduate","Barlow",serif;font-weight:400}

/* Crest header: the crest sits on the navy band and breaks over its bottom edge */
header{
  background:var(--navy);color:var(--cream);text-align:center;
  padding:calc(18px + env(safe-area-inset-top)) 18px 0;
  border-bottom:4px solid var(--grass);
  position:relative;margin-bottom:98px;
}
header h1{margin:0;font-size:1.45rem;letter-spacing:.04em;line-height:1.1}
header p{margin:4px 0 0;color:#B9C4CC;font-size:.92rem}
.crest{
  display:block;width:148px;height:auto;margin:14px auto -84px;
  position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(4,19,31,.35));
}
main{max-width:560px;margin:0 auto;padding:0 12px 18px}
/* White panel holding the UI */
main section{
  background:var(--panel);border-radius:18px;padding:20px 16px 22px;
  box-shadow:0 10px 30px rgba(4,19,31,.22);
}
h2{font-size:1.35rem;margin:26px 0 10px;line-height:1.15;letter-spacing:.02em}
h2:first-child{margin-top:4px}
select,input{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:12px;
}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px;color:var(--muted)}
button{font:inherit;cursor:pointer}
/* Number boxes: typed digits only, no up/down arrows */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:3px solid var(--grass);outline-offset:2px}
.btn{
  width:100%;border:0;border-radius:12px;padding:15px;font-weight:600;font-size:1.05rem;
  background:var(--navy);color:var(--cream);box-shadow:inset 0 -4px 0 var(--grass);
}
@media (prefers-color-scheme: dark){.btn{background:var(--grass);color:var(--navy);box-shadow:inset 0 -4px 0 var(--grass-deep)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{color:var(--muted);font-size:.92rem;margin:8px 0}
.msg{padding:14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);margin:12px 0}
.msg.err{border-color:var(--danger);color:var(--danger)}
.msg.ok{border-color:var(--grass);border-left-width:6px}

/* Vote form: one big input per row */
.big{font-size:1.15rem;padding:16px 14px;min-height:58px;border-radius:12px}
select.big{appearance:none;-webkit-appearance:none;padding-right:44px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.vote-label{display:flex;align-items:baseline;gap:8px}
.vote-label .vv{font-family:"Graduate",serif;font-size:1.5rem;line-height:1}
.vote-label[data-v="3"] .vv{color:var(--gold)}
.vote-label[data-v="2"] .vv{color:var(--silver)}
.vote-label[data-v="1"] .vv{color:var(--bronze)}
.actions{margin-top:26px}

/* Results */
.board{list-style:none;padding:0;margin:0}
.board li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.board .rank{font-size:1.1rem;width:1.8em;color:var(--muted)}
.board li:first-child{background:linear-gradient(90deg, color-mix(in srgb, var(--grass) 18%, transparent), transparent 80%);border-radius:8px 0 0 8px}
.board li:first-child .rank{color:var(--accent)}
.board .nm{flex:1;font-weight:600}
.board .break{font-size:.8rem;color:var(--muted);font-weight:400}
.board .pts{font-size:1.5rem}
/* Expandable vote rows (admin): tap a player to see who voted for them */
.board li.x{display:block;padding:0}
.board details summary{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer;list-style:none}
.board details summary::-webkit-details-marker{display:none}
.board details summary .chev{color:var(--muted);transition:transform .15s;font-size:.9rem}
.board details[open] summary .chev{transform:rotate(90deg)}
.voters{list-style:none;margin:0 0 10px 2.4em;padding:0}
.voters li{display:flex !important;gap:10px;padding:5px 0 !important;border:0 !important;background:none !important;font-size:.92rem}
.voters .vv{font-family:"Graduate",serif;min-width:1.2em}
.voters .vv.v3{color:var(--gold)} .voters .vv.v2{color:var(--silver)} .voters .vv.v1{color:var(--bronze)}
.voters .rd{margin-left:auto;color:var(--muted);font-size:.82rem;text-align:right}

/* Admin */
.match-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.match-row .info{flex:1}
.match-row .info b{display:block}
.match-row .info span{font-size:.85rem;color:var(--muted)}
.small{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:.85rem;font-weight:600}
.small.del{color:var(--danger)}
.status{font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:99px;border:1.5px solid currentColor;margin-left:6px}
.status.open{color:var(--accent)}
.match-row{flex-wrap:wrap}
.match-row .scoreline{flex-basis:100%;font-size:.88rem;color:var(--muted);margin-top:-4px}
.score-edit{flex-basis:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:4px;background:var(--surface)}
.score-edit label{margin-top:0}
.sgrid{display:grid;grid-template-columns:1fr 64px 64px 52px;gap:8px;align-items:center;margin:12px 0}
.sgrid .h{font-size:.78rem;font-weight:600;color:var(--muted);text-align:center}
.sgrid .h:first-child{text-align:left}
.sgrid .team{font-weight:600;font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.sgrid input{padding:10px 4px;text-align:center;font-size:1.1rem}
.sgrid .tot{font-family:"Graduate",serif;font-size:1.3rem;text-align:center}

/* Scoreboard on Results */
.scoreboard{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0 4px}
.scoreboard .row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.scoreboard .row + .row{border-top:1px solid var(--line)}
.scoreboard .team{flex:1;font-weight:600}
.scoreboard .gb{color:var(--muted);font-size:.95rem}
.scoreboard .tot{font-family:"Graduate",serif;font-size:1.6rem;min-width:2.4em;text-align:right}
.scoreboard .row.win{background:color-mix(in srgb, var(--grass) 14%, transparent)}
.result-tag{font-size:.85rem;font-weight:600;color:var(--muted);margin:6px 2px 0}
.record{font-family:"Graduate",serif;font-size:1.2rem}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navy);border-top:3px solid var(--grass);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;border:0;background:none;color:#8C9AA6;padding:15px 0 13px;font-size:.95rem;letter-spacing:.06em}
.tab[aria-current="true"]{color:var(--cream);box-shadow:inset 0 -4px 0 var(--grass)}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

/* Intro splash: crest spins in, stomps down, then the splash fades at 3s */
#intro{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%, rgba(4,19,31,.05), rgba(4,19,31,.45) 75%), var(--navy) url(/bg.jpg) center bottom/cover no-repeat;
  animation:intro-out .4s ease-in 2.6s forwards;
}
#intro .stage{position:relative;display:grid;place-items:center;animation:intro-shake .35s linear 1.1s}
#intro img{
  width:min(58vw,240px);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5));
  animation:crest-spin 1.1s cubic-bezier(.3,.1,.6,1) both, crest-stomp .3s cubic-bezier(.2,.9,.3,1.4) 1.1s forwards;
}
#intro .ring{
  position:absolute;left:50%;top:58%;width:min(58vw,240px);aspect-ratio:3/1;
  border:4px solid var(--grass);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.4);
  animation:ring 0.7s ease-out 1.1s;
}
#intro .tag{
  position:absolute;top:calc(100% + 26px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:"Graduate",serif;color:var(--cream);letter-spacing:.12em;font-size:1.15rem;text-shadow:0 2px 8px rgba(4,19,31,.8);
  opacity:0;animation:tag-in .4s ease-out 1.45s forwards;
}
@keyframes crest-spin{
  0%  {transform:scale(.15) rotate(-900deg);opacity:0}
  15% {opacity:1}
  80% {transform:scale(1.7) rotate(-40deg)}
  100%{transform:scale(1.55) rotate(0deg)}
}
@keyframes crest-stomp{
  0%  {transform:scale(1.55)}
  45% {transform:scale(.88,.82) translateY(6%)}
  75% {transform:scale(1.04)}
  100%{transform:scale(1)}
}
@keyframes ring{
  0%  {opacity:.9;transform:translate(-50%,-50%) scale(.4)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}
}
@keyframes intro-shake{
  0%,100%{transform:none} 15%{transform:translate(-7px,5px)} 30%{transform:translate(6px,-6px)}
  45%{transform:translate(-5px,-3px)} 60%{transform:translate(4px,4px)} 80%{transform:translate(-2px,1px)}
}
@keyframes tag-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes intro-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){
  #intro,#intro .stage,#intro img,#intro .ring{animation:none}
  #intro{animation:intro-out .4s ease-in 2.6s forwards}
  #intro .tag{animation:none;opacity:1}
}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="stage">
    <span class="ring"></span>
    <img src="/logo.png" alt="" width="400" height="486">
    <span class="tag">Best on Ground</span>
  </div>
</div>
<header>
  <h1>Best on Ground</h1>
  <p>Log your goals and cast your 3, 2, 1 votes.</p>
  <img class="crest" src="/logo.png" alt="Grass Stains, est. 2025" width="400" height="486">
</header>

<main>
  <section id="view-vote"></section>
  <section id="view-results" class="hidden"></section>
  <section id="view-admin" class="hidden"></section>
</main>

<nav>
  <button class="tab" data-view="vote" aria-current="true">Vote</button>
  <button class="tab hidden" data-view="results">Results</button>
  <button class="tab" data-view="admin">Rounds</button>
</nav>

<script>
const API = "/api/bog";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = {
  players: [], matches: [], submitted: [],
  matchId: "", voter: "", goals: 0, picks: {3:null,2:null,1:null},
  flash: null, pin: "", resultsFor: "season", view: "vote",
};
try { st.pin = sessionStorage.getItem("bogPin") || ""; } catch {}
const savePin = pin => { st.pin = pin; try { pin ? sessionStorage.setItem("bogPin", pin) : sessionStorage.removeItem("bogPin"); } catch {} syncTabs(); };
const byId = id => st.players.find(p => p.id === id);
const pts = t => t.g * 6 + t.b;
const OUR_TEAM = "Grass Stains";
const oppName = m => m.opponent || "Opposition";
const fmtScore = t => `${t.g}.${t.b} (${pts(t)})`;
const outcome = sc => pts(sc.us) > pts(sc.them) ? "Won" : pts(sc.us) < pts(sc.them) ? "Lost" : "Drew";
const scoreLine = m => m.score ? `${outcome(m.score)}: ${OUR_TEAM} ${fmtScore(m.score.us)} to ${oppName(m)} ${fmtScore(m.score.them)}` : "No score entered";
// Admin-only data: totals plus matches with scores. A bad PIN locks the admin views again.
async function adminData(match) {
  try { return await post({ action: "results", match, pin: st.pin }); }
  catch (err) { if (/PIN/.test(err.message)) { savePin(""); show("admin"); } throw err; }
}
const label = m => m.title + (m.date ? " (" + new Date(m.date + "T00:00").toLocaleDateString(undefined, {day:"numeric", month:"short"}) + ")" : "");

async function getData(match) {
  const q = match && match !== "season" ? `?match=${encodeURIComponent(match)}` : "";
  const r = await fetch(API + q, { cache: "no-store" });
  if (!r.ok) throw new Error("Couldn't load data.");
  const d = await r.json();
  st.players = d.players;
  st.matches = d.matches.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return d;
}
async function post(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong. Try again.");
  return d;
}
const loadErr = el => el.innerHTML = `<div class="msg err">Couldn't reach the server. Check your connection and refresh.</div>`;

/* ---------- VOTE ---------- */
async function renderVote(reload = true) {
  const el = document.getElementById("view-vote");
  if (reload) {
    try {
      await getData("season");
      const open = st.matches.filter(m => m.open);
      if (!open.find(m => m.id === st.matchId)) st.matchId = open[0]?.id || "";
      if (st.matchId) st.submitted = (await getData(st.matchId)).submitted;
    } catch { return loadErr(el); }
  }
  const open = st.matches.filter(m => m.open);
  if (!open.length) {
    el.innerHTML = `<h2>No rounds open</h2><p class="note">Voting opens once a round is added.</p>`;
    return;
  }
  if (st.submitted.includes(st.voter)) st.voter = "";
  const ready = st.voter && [3,2,1].every(v => st.picks[v]);
  const choices = st.players.filter(p => p.id !== st.voter);

  el.innerHTML = `
    ${st.flash ? `<div class="msg ${st.flash.ok ? "ok" : "err"}">${esc(st.flash.text)}</div>` : ""}
    <label for="match">Round</label>
    <select id="match" class="big">${open.map(m => `<option value="${m.id}" ${m.id === st.matchId ? "selected" : ""}>${esc(label(m))}</option>`).join("")}</select>

    <label for="voter">Your name</label>
    <select id="voter" class="big">
      <option value="">Select your name</option>
      ${st.players.map(p => {
        const done = st.submitted.includes(p.id);
        return `<option value="${p.id}" ${p.id === st.voter ? "selected" : ""} ${done ? "disabled" : ""}>${esc(p.name)}${done ? " (submitted)" : ""}</option>`;
      }).join("")}
    </select>

    ${[3,2,1].map(v => `
      <label for="v${v}" class="vote-label" data-v="${v}"><span class="vv">${v}</span> ${v === 1 ? "vote" : "votes"}</label>
      <select id="v${v}" class="big" data-v="${v}">
        <option value="">Select a player</option>
        ${choices.map(p => {
          const taken = [3,2,1].some(x => x !== v && st.picks[x] === p.id);
          return `<option value="${p.id}" ${st.picks[v] === p.id ? "selected" : ""} ${taken ? "disabled" : ""}>${esc(p.name)}</option>`;
        }).join("")}
      </select>`).join("")}

    <label for="goals">How many goals did you kick?</label>
    <input id="goals" class="big" type="number" inputmode="numeric" min="0" max="30" step="1" value="${st.goals}">

    <div class="actions">
    <button class="btn" id="submit" ${ready ? "" : "disabled"}>Submit</button>
    <p class="note">${st.voter ? "Teammates only see totals. Only the admin can see who you voted for." : "Select your name to submit."}</p>
    </div>
  `;

  el.querySelector("#match").onchange = async e => { st.matchId = e.target.value; st.flash = null; reset(); renderVote(); };
  el.querySelector("#voter").onchange = e => {
    st.voter = e.target.value; st.flash = null;
    [3,2,1].forEach(v => { if (st.picks[v] === st.voter) st.picks[v] = null; });
    renderVote(false);
  };
  el.querySelectorAll("select[data-v]").forEach(sel => sel.onchange = () => {
    st.picks[+sel.dataset.v] = sel.value || null; renderVote(false);
  });
  el.querySelector("#goals").oninput = e => { st.goals = e.target.value; };
  el.querySelector("#submit").onclick = async e => {
    const goals = String(st.goals).trim() === "" ? 0 : Number(st.goals);
    if (!Number.isInteger(goals) || goals < 0 || goals > 30) {
      st.flash = { ok: false, text: "Goals must be a whole number from 0 to 30." };
      renderVote(false); scrollTo(0, 0); return;
    }
    e.target.disabled = true; e.target.textContent = "Submitting…";
    try {
      await post({ action: "vote", match: st.matchId, voter: st.voter, goals, v3: st.picks[3], v2: st.picks[2], v1: st.picks[1] });
      st.flash = { ok: true, text: `Thanks ${byId(st.voter).name.split(" ")[0]}, your votes are in.` };
      reset(); st.voter = "";
      renderVote(); scrollTo(0, 0);
    } catch (err) {
      st.flash = { ok: false, text: err.message };
      renderVote(false); scrollTo(0, 0);
    }
  };
}
function reset() { st.picks = {3:null,2:null,1:null}; st.goals = 0; }

/* ---------- RESULTS (admin only) ---------- */
function scoreboard(m) {
  const sc = m.score, win = outcome(sc);
  return `<div class="scoreboard">
      <div class="row ${win === "Won" ? "win" : ""}"><span class="team">${OUR_TEAM}</span><span class="gb">${sc.us.g}.${sc.us.b}</span><span class="tot">${pts(sc.us)}</span></div>
      <div class="row ${win === "Lost" ? "win" : ""}"><span class="team">${esc(oppName(m))}</span><span class="gb">${sc.them.g}.${sc.them.b}</span><span class="tot">${pts(sc.them)}</span></div>
    </div>
    <p class="result-tag">${win === "Drew" ? "Draw" : win + " by " + Math.abs(pts(sc.us) - pts(sc.them))}</p>`;
}
async function renderResults() {
  const el = document.getElementById("view-results");
  if (!st.pin) return show("admin");
  el.innerHTML = `<p class="note">Counting votes…</p>`;
  let d;
  try {
    d = await adminData(st.resultsFor);
    if (st.resultsFor !== "season" && !d.matches.find(m => m.id === st.resultsFor)) { st.resultsFor = "season"; d = await adminData("season"); }
  } catch (err) { return el.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  const matches = d.matches.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const m = matches.find(x => x.id === st.resultsFor);

  const nameOf = id => d.players.find(p => p.id === id)?.name || id;
  const roundOf = id => matches.find(x => x.id === id)?.title || "";
  const votes = d.players.map(p => ({ p, ...d.tally[p.id] })).filter(r => r.pts > 0)
    .sort((a, b) => b.pts - a.pts || b.c3 - a.c3 || b.c2 - a.c2);
  const goals = d.players.map(p => ({ p, g: d.goals[p.id] })).filter(r => r.g > 0).sort((a, b) => b.g - a.g);
  const pending = m ? d.players.filter(p => !d.submitted.includes(p.id)) : [];
  const scored = matches.filter(x => x.score);
  const rec = { Won: 0, Lost: 0, Drew: 0 };
  scored.forEach(x => rec[outcome(x.score)]++);

  el.innerHTML = `
    <label for="rfor">Show</label>
    <select id="rfor" class="big">
      <option value="season" ${!m ? "selected" : ""}>Season total</option>
      ${matches.map(x => `<option value="${x.id}" ${m && m.id === x.id ? "selected" : ""}>${esc(label(x))}</option>`).join("")}
    </select>

    <h2>Score</h2>
    ${m ? (m.score ? scoreboard(m) : `<p class="note">No score entered yet. Add it under Rounds.</p>`)
        : (scored.length ? `<p class="record">${rec.Won}W ${rec.Lost}L${rec.Drew ? " " + rec.Drew + "D" : ""}</p>
            <ol class="board">${scored.map(x => `<li><span class="nm">${esc(x.title)}<br><span class="break">${esc(scoreLine(x))}</span></span><span class="pts">${pts(x.score.us)}–${pts(x.score.them)}</span></li>`).join("")}</ol>`
          : `<p class="note">No scores entered yet.</p>`)}

    <h2>Votes</h2>
    ${!votes.length ? `<p class="note">No votes yet.</p>` : `
      <p class="note">${d.ballots} ballot${d.ballots === 1 ? "" : "s"} counted</p>
      <p class="note">Tap a player to see who voted for them.</p>
      <ol class="board">${votes.map((r, i) => {
        const by = (d.votedBy?.[r.p.id] || []).slice().sort((a, b) => b.v - a.v || nameOf(a.voter).localeCompare(nameOf(b.voter)));
        return `<li class="x"><details><summary><span class="rank">${i + 1}</span>
          <span class="nm">${esc(r.p.name)}<br><span class="break">${r.c3}×3, ${r.c2}×2, ${r.c1}×1</span></span>
          <span class="pts">${r.pts}</span><span class="chev" aria-hidden="true">▶</span></summary>
          <ul class="voters">${by.map(x => `<li><span class="vv v${x.v}">${x.v}</span><span>${esc(nameOf(x.voter))}</span>${!m ? `<span class="rd">${esc(roundOf(x.match))}</span>` : ""}</li>`).join("")}</ul>
        </details></li>`;
      }).join("")}</ol>`}

    <h2>Goals</h2>
    ${!goals.length ? `<p class="note">No goals logged yet.</p>` : `
      <ol class="board">${goals.map((r, i) => `
        <li><span class="rank">${i + 1}</span><span class="nm">${esc(r.p.name)}</span><span class="pts">${r.g}</span></li>`).join("")}</ol>`}

    ${m ? `
      <h2>Still to vote</h2>
      <p class="note">${pending.length ? pending.map(p => esc(p.name)).join(", ") : "Everyone has voted."}</p>` : ""}
  `;
  el.querySelector("#rfor").onchange = e => { st.resultsFor = e.target.value; renderResults(); };
}

/* ---------- ADMIN ---------- */
let editing = null; // id of the round whose score editor is open
async function renderAdmin(msg) {
  const el = document.getElementById("view-admin");
  if (!st.pin) {
    el.innerHTML = `<h2>Admin</h2>
      <p class="note">Enter the admin PIN to manage rounds and see results.</p>
      <label for="pin">Admin PIN</label>
      <input id="pin" class="big" type="password" inputmode="numeric" autocomplete="off">
      <div style="height:12px"></div>
      <button class="btn" id="unlock">Unlock</button>
      <div id="pinerr"></div>`;
    const go = async () => {
      const pin = el.querySelector("#pin").value;
      try { await post({ action: "checkPin", pin }); savePin(pin); renderAdmin(); }
      catch (err) { el.querySelector("#pinerr").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
    };
    el.querySelector("#unlock").onclick = go;
    el.querySelector("#pin").onkeydown = e => { if (e.key === "Enter") go(); };
    return;
  }
  let matches;
  try { matches = (await adminData("season")).matches.sort((a, b) => (b.date || "").localeCompare(a.date || "")); }
  catch (err) { return st.pin && (el.innerHTML = `<div class="msg err">${esc(err.message)}</div>`); }
  const today = new Date().toISOString().slice(0, 10);
  const num = (id, v) => `<input id="${id}" type="number" inputmode="numeric" min="0" max="99" step="1" value="${v ?? ""}" placeholder="0">`;

  el.innerHTML = `
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}
    <h2>Add a round</h2>
    <label for="mt">Round name</label>
    <input id="mt" placeholder="Round 4 vs Eastside">
    <label for="md">Date</label>
    <input id="md" type="date" value="${today}">
    <div style="height:14px"></div>
    <button class="btn" id="add">Add round and open voting</button>
    <h2>Rounds</h2>
    ${matches.length ? matches.map(m => `
      <div class="match-row">
        <div class="info"><b>${esc(m.title)}</b><span>${m.date || ""}<span class="status ${m.open ? "open" : ""}">${m.open ? "Open" : "Closed"}</span></span></div>
        <button class="small" data-score="${m.id}">${editing === m.id ? "Cancel" : "Score"}</button>
        <button class="small" data-toggle="${m.id}">${m.open ? "Close" : "Reopen"}</button>
        <button class="small del" data-del="${m.id}" aria-label="Delete ${esc(m.title)}">Delete</button>
        <div class="scoreline">${esc(scoreLine(m))}</div>
        ${editing === m.id ? `
          <div class="score-edit" data-for="${m.id}">
            <label for="opp">Opposition name</label>
            <input id="opp" value="${esc(m.opponent || "")}" placeholder="e.g. Eastside">
            <div class="sgrid">
              <span class="h">Team</span><span class="h">Goals</span><span class="h">Behinds</span><span class="h">Total</span>
              <span class="team">${OUR_TEAM}</span>${num("ug", m.score?.us.g)}${num("ub", m.score?.us.b)}<span class="tot" id="ut">0</span>
              <span class="team" id="oppLbl">${esc(oppName(m))}</span>${num("tg", m.score?.them.g)}${num("tb", m.score?.them.b)}<span class="tot" id="tt">0</span>
            </div>
            <button class="btn" id="saveScore">Save score</button>
          </div>` : ""}
      </div>`).join("") : `<p class="note">No rounds yet. Add your first one above.</p>`}
    <div style="height:22px"></div>
    <button class="small" id="lock">Lock admin</button>`;

  const act = async body => {
    try { await post({ ...body, pin: st.pin }); renderAdmin(); }
    catch (err) { renderAdmin(err.message); }
  };
  el.querySelector("#add").onclick = () => {
    const title = el.querySelector("#mt").value.trim();
    if (!title) return el.querySelector("#mt").focus();
    act({ action: "addMatch", title, date: el.querySelector("#md").value });
  };
  el.querySelectorAll("[data-score]").forEach(b => b.onclick = () => { editing = editing === b.dataset.score ? null : b.dataset.score; renderAdmin(); });
  el.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => act({ action: "toggle", id: b.dataset.toggle }));
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const m = matches.find(x => x.id === b.dataset.del);
    if (confirm(`Delete "${m.title}" and all its votes, goals and score?`)) act({ action: "delete", id: m.id });
  });
  el.querySelector("#lock").onclick = () => { savePin(""); editing = null; show("admin"); };

  const ed = el.querySelector(".score-edit");
  if (ed) {
    const v = id => { const x = ed.querySelector("#" + id).value.trim(); return x === "" ? 0 : Number(x); };
    const totals = () => {
      ed.querySelector("#ut").textContent = pts({ g: v("ug"), b: v("ub") }) || 0;
      ed.querySelector("#tt").textContent = pts({ g: v("tg"), b: v("tb") }) || 0;
      ed.querySelector("#oppLbl").textContent = ed.querySelector("#opp").value.trim() || "Opposition";
    };
    ed.querySelectorAll("input").forEach(i => i.oninput = totals);
    totals();
    ed.querySelector("#saveScore").onclick = async () => {
      const id = ed.dataset.for;
      try {
        await post({ action: "score", pin: st.pin, id, opponent: ed.querySelector("#opp").value,
          us: { g: v("ug"), b: v("ub") }, them: { g: v("tg"), b: v("tb") } });
        editing = null; renderAdmin();
      } catch (err) { renderAdmin(err.message); }
    };
  }
}

/* ---------- nav ---------- */
function syncTabs() {
  document.querySelector('.tab[data-view="results"]').classList.toggle("hidden", !st.pin);
  document.querySelector('.tab[data-view="admin"]').textContent = st.pin ? "Rounds" : "Admin";
}
function show(view) {
  if (view === "results" && !st.pin) view = "admin";
  st.view = view;
  syncTabs();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === view));
  ["vote", "results", "admin"].forEach(v => document.getElementById("view-" + v).classList.toggle("hidden", v !== view));
  if (view === "vote") { st.flash = null; renderVote(); }
  if (view === "results") renderResults();
  if (view === "admin") renderAdmin();
}
syncTabs();
document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.view));
document.getElementById("view-vote").innerHTML = `<p class="note">Loading rounds…</p>`;
renderVote();
// Remove the intro splash after 3 seconds (tap to skip)
const intro = document.getElementById("intro");
const endIntro = () => intro && intro.remove();
setTimeout(endIntro, 3000);
intro.onclick = endIntro;
</script>
</body>
</html>
